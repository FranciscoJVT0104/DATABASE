<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestor CSV</title>
    <link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            margin: 8px;
            padding: 10px 18px;
            background: #007bff;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        #csvFile::file-selector-button {
            background-color: rgb(0, 207, 0);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        #csvFile::file-selector-button:hover {
            background-color: #009f08;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 6px;
            text-align: left;
        }

        th {
            background: #ddd;
        }

        td[contenteditable="true"] {
            background-color: #f7f7f7;
        }
    </style>
</head>

<body>

    <h2>Gestor CSV – Matricula / Contacto</h2>

    <!-- Entrada CSV -->
    <input type="file" id="csvFile" accept=".csv" />
    <br><br>
    <!-- Botones independientes -->
    <button id="exportREV"><i class="fa-solid fa-pen-to-square fa-lg" style="color: #ffffff;"></i> Exportar REV_NOV.csv</button>
    <button id="exportCONT"> <i class="fa-solid fa-address-book fa-lg" style="color: #ffffff;"></i> Exportar CONT_NOV.csv</button>

    <!-- Tabla -->
    <div id="tableContainer"></div>

    <script src="script.js"></script>

</body>

</html>
